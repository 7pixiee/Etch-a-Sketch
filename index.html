<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch a Sketch</title>
    <style>
        body {
            height: 100%;
            width: 100vw;
            background-color: #D9ADAD;
            margin: 0;
            padding: 0;
        }
        #container{
            background-color: gray;
             box-sizing: border-box;
            position: relative;
            height: 700px;
            width: 700px;
            border-radius: 10px;
            margin: 55px auto;
            display: flex;
            align-items: center;
            
        }
        h1 {
            font-family: "Lucida Handwriting", 'Segoe Script', "Comic Sans MS";
            position: absolute;
            top: 1.6%;
            left: 21%;
            font-size: 1.7rem ;
            text-shadow: 2px 2px 3px rgb(66, 66, 66) ;
        }
        h1 span{
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            margin: 0 7px;
        }
        .canvas {
            display: flex;
            flex-wrap: wrap;
            height: 500px;
            width: 500px;
            border-radius: 5px;
            margin: 7% auto;
            background-color: rgb(254, 243, 243);
        }
        #buttons {
            
            width: 100%;
            height: 100px;
            z-index: 1;
            position: absolute;
            bottom: 3%;
            right: 0%;
            display: flex;
            justify-content: space-between
        }
        .grid-size, .grid-clear{
            width: 100px;
            height: 100%;
            background-color: rgb(116, 38, 38);
            border-radius: 50%;
            margin: 10px;
            border: none;
            font-size: 1.7rem;
            font-family:cursive;
            box-shadow: 0px 5px 5px rgb(71, 13, 13);
        }
        .grid-cell {
            box-sizing: border-box;
            border: 1px solid #ddd;
        }
        </style>
</head>
<body>
    <div id="container">
        <h1> <span>MAGIC</span> Etch a Sketch <span>SCREEN</span> </h1>
    <div class="canvas"></div>
    <div id="buttons">
        <button class="grid-size">Size</button>
        <button class="grid-clear">Clear</button>
    </div>
    </div>
    
    <script src="index.js">
        </Script>
</body>
</html>
