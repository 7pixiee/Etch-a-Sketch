<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch a Sketch</title>
    <style>
        body {
            height: 100%;
            width: 100vw;
            background-image: linear-gradient(to bottom, #233A4E 10%, #9C6DB0);
            margin: 0;
            padding: 0;
        }

        #container {
            background-image: linear-gradient(to bottom, #274158, #b57dcd);
            box-sizing: border-box;
            box-shadow: 20px 20px 35px #1f3951;
            position: relative;
            height: 700px;
            width: 700px;
            border-radius: 10px;
            margin: 55px auto;
            display: flex;
            align-items: center;

        }

        h1 {
            font-family: "Lucida Handwriting", 'Segoe Script', "Comic Sans MS";
            position: absolute;
            top: 1.6%;
            left: 21%;
            font-size: 1.7rem;
            text-shadow: 2px 2px 3px rgb(152, 124, 169);
            color: #dac0e5
        }

        h1 span {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            margin: 0 7px;
        }

        .canvas {
            display: flex;
            flex-wrap: wrap;
            height: 500px;
            width: 500px;
            border-radius: 5px;
            margin: 7% auto;
            background-color: rgb(255, 242, 242);
        }

        #buttons {

            width: 100%;
            height: 100px;
            z-index: 1;
            position: absolute;
            bottom: 3%;
            right: 0%;
            display: flex;
            justify-content: space-between
        }

        .grid-size,
        .grid-clear {
            width: 100px;
            height: 100%;
            cursor: pointer;
            color: rgb(243, 200, 252);
            background:
                radial-gradient(circle at 70% 25%, rgba(255, 255, 255, .35), transparent 25%),
                linear-gradient(135deg, #261E3E, #414A6C 50%, #809CC1);

            box-shadow:
                inset 0 2px 8px rgba(255, 255, 255, 0.15),
                inset 0 -6px 12px rgba(0, 0, 0, 0.25),
                0 8px 20px rgba(12, 5, 22, 0.35);

            transition: all 0.3s ease;
            border-radius: 50%;
            margin: 10px;
            border: none;
            font-size: 1.7rem;
            font-family: cursive;
            box-shadow: 0px 5px 5px rgb(28, 41, 66);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow:
                inset 0 2px 10px rgba(255, 255, 255, 0.2),
                inset 0 -8px 15px rgba(0, 0, 0, 0.3),
        }

        .grid-cell {
            box-sizing: border-box;
            border: 1px solid #ddd;
            transition: background-color 0.1s ease;
        }
    </style>
</head>

<body>
    <div id="container">
        <h1> <span>MAGIC</span> Etch a Sketch <span>SCREEN</span> </h1>
        <div class="canvas"></div>
        <div id="buttons">
            <button class="grid-size">Size</button>
            <button class="grid-clear">Clear</button>
        </div>
    </div>

    <script src="index.js">
    </Script>
</body>

</html>
